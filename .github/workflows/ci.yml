name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      # lib/ is committed; a build that changes it means src and the shipped
      # artifacts drifted — fail loud so the PR includes the regenerated bundle.
      - name: Verify committed artifacts are up to date
        run: git diff --exit-code -- lib/

      - name: Test
        run: npm test
